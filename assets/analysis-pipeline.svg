<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <defs>
    <marker id="parr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9" fill="none" stroke="#8b949e" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect x="2" y="2" width="1196" height="696" rx="12" fill="#fbfcfd" stroke="#d0d7de" stroke-width="1.5"/>

  <text x="34" y="46" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="600" fill="#1f2328">How an .eml becomes a verdict</text>
  <text x="34" y="68" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#57606a">phishing-email-analyzer · static analysis pipeline · no network, no execution</text>

  <g font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
    <!-- 01 input -->
    <rect x="24" y="240" width="172" height="116" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
    <text x="42" y="268" font-size="12" fill="#0969da" font-weight="700">01 · INPUT</text>
    <text x="42" y="292" font-size="14.5" font-weight="600" fill="#1f2328">raw .eml files</text>
    <text x="42" y="316" font-size="12.5" fill="#57606a">7 sample messages</text>
    <text x="42" y="338" font-size="12.5" fill="#57606a">inputs never modified</text>

    <!-- 02 parse -->
    <rect x="248" y="240" width="200" height="116" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
    <text x="266" y="268" font-size="12" fill="#0969da" font-weight="700">02 · PARSE</text>
    <text x="266" y="292" font-size="14.5" font-weight="600" fill="#1f2328">stdlib email package</text>
    <text x="266" y="316" font-size="12.5" fill="#57606a">headers · body text</text>
    <text x="266" y="338" font-size="12.5" fill="#57606a">links · attachments</text>

    <!-- 03 rule modules -->
    <rect x="500" y="88" width="238" height="128" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
    <text x="518" y="114" font-family="SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace" font-size="13.5" font-weight="600" fill="#1f2328">header_rules.py</text>
    <text x="518" y="137" font-size="12.5" fill="#57606a">SPF / DKIM / DMARC outcomes</text>
    <text x="518" y="158" font-size="12.5" fill="#57606a">Reply-To vs From mismatch</text>
    <text x="518" y="179" font-size="12.5" fill="#57606a">display-name impersonation</text>
    <text x="518" y="200" font-size="12.5" fill="#57606a">IP-only originating hops</text>

    <rect x="500" y="244" width="238" height="128" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
    <text x="518" y="270" font-family="SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace" font-size="13.5" font-weight="600" fill="#1f2328">url_rules.py</text>
    <text x="518" y="293" font-size="12.5" fill="#57606a">link-text vs href mismatch</text>
    <text x="518" y="314" font-size="12.5" fill="#57606a">URL-shortener services</text>
    <text x="518" y="335" font-size="12.5" fill="#57606a">lookalike / homoglyph / punycode</text>
    <text x="518" y="356" font-size="12.5" fill="#57606a">IPv4 &amp; IPv6 literal hosts</text>

    <rect x="500" y="400" width="238" height="128" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
    <text x="518" y="426" font-family="SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace" font-size="13.5" font-weight="600" fill="#1f2328">content_rules.py</text>
    <text x="518" y="449" font-size="12.5" fill="#57606a">urgency &amp; pressure phrases</text>
    <text x="518" y="470" font-size="12.5" fill="#57606a">credential-harvest language</text>
    <text x="518" y="491" font-size="12.5" fill="#57606a">risky attachments (exe, macros)</text>
    <text x="518" y="512" font-size="12.5" fill="#57606a">double-extension filenames</text>

    <!-- 04 findings -->
    <rect x="790" y="240" width="184" height="116" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
    <text x="808" y="268" font-size="12" fill="#0969da" font-weight="700">04 · FINDINGS</text>
    <text x="808" y="292" font-size="14.5" font-weight="600" fill="#1f2328">immutable Finding</text>
    <text x="808" y="316" font-size="12.5" fill="#57606a">rule_id · weight</text>
    <text x="808" y="338" font-size="12.5" fill="#57606a">evidence · explanation</text>

    <!-- 05 scoring -->
    <rect x="992" y="240" width="184" height="116" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
    <text x="1010" y="268" font-size="12" fill="#0969da" font-weight="700">05 · SCORING</text>
    <text x="1010" y="292" font-size="14.5" font-weight="600" fill="#1f2328">weighted sum</text>
    <text x="1010" y="316" font-size="12.5" fill="#57606a">capped at 100</text>
    <text x="1010" y="338" font-size="12.5" fill="#57606a">→ risk band assigned</text>

    <!-- arrows -->
    <line x1="198" y1="298" x2="242" y2="298" stroke="#8b949e" stroke-width="1.6" marker-end="url(#parr)"/>
    <line x1="450" y1="298" x2="492" y2="150" stroke="#8b949e" stroke-width="1.4" marker-end="url(#parr)"/>
    <line x1="450" y1="298" x2="492" y2="298" stroke="#8b949e" stroke-width="1.4" marker-end="url(#parr)"/>
    <line x1="450" y1="298" x2="492" y2="462" stroke="#8b949e" stroke-width="1.4" marker-end="url(#parr)"/>
    <line x1="740" y1="150" x2="782" y2="298" stroke="#8b949e" stroke-width="1.4" marker-end="url(#parr)"/>
    <line x1="740" y1="298" x2="782" y2="298" stroke="#8b949e" stroke-width="1.4" marker-end="url(#parr)"/>
    <line x1="740" y1="462" x2="782" y2="298" stroke="#8b949e" stroke-width="1.4" marker-end="url(#parr)"/>
    <line x1="976" y1="298" x2="986" y2="298" stroke="#8b949e" stroke-width="1.6" marker-end="url(#parr)"/>
    <line x1="1084" y1="358" x2="1084" y2="552" stroke="#8b949e" stroke-width="1.4" marker-end="url(#parr)"/>
  </g>

  <!-- bottom: risk bands -->
  <rect x="24" y="556" width="700" height="112" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="42" y="582" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#57606a">risk bands — score capped at 100</text>
  <g font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600">
    <rect x="42" y="592" width="152" height="38" rx="6" fill="#dafbe1"/>
    <text x="118" y="616" text-anchor="middle" fill="#116329">LOW · 0–19</text>
    <rect x="206" y="592" width="152" height="38" rx="6" fill="#fff8c5"/>
    <text x="282" y="616" text-anchor="middle" fill="#9a6700">MODERATE · 20–49</text>
    <rect x="370" y="592" width="152" height="38" rx="6" fill="#fff1e5"/>
    <text x="446" y="616" text-anchor="middle" fill="#b35900">HIGH · 50–74</text>
    <rect x="534" y="592" width="152" height="38" rx="6" fill="#ffebe9"/>
    <text x="610" y="616" text-anchor="middle" fill="#cf222e">CRITICAL · 75–100</text>
  </g>

  <!-- bottom: reporting -->
  <rect x="748" y="556" width="428" height="112" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="766" y="582" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#57606a">reporting.py → two artifacts</text>
  <text x="766" y="606" font-family="SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace" font-size="12.5" fill="#1f2328">phishing-report.html</text>
  <text x="766" y="624" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#57606a">dark, self-contained · URLs as code, never anchors</text>
  <text x="766" y="646" font-family="SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace" font-size="12.5" fill="#1f2328">phishing-report.json</text>
  <text x="766" y="664" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#57606a">machine-readable export</text>

  <text x="600" y="692" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#8b949e">100% python stdlib · fully offline · links never fetched · attachments never executed · data never leaves the host</text>
</svg>
